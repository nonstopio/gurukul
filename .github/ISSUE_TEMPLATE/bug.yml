name: Bug report
description: Something in Gurukul does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Learner, Admin console, Studio, Certificates, Sign-in, Other]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on macOS, 1440px window
