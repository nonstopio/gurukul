name: CI

# Every pull request and every push to `main`. Branch protection requires the `ci` job at the
# bottom (it passes only when every other job passed) and `PR title / pr-title` (pr-title.yml).
# A successful run on `main` is what triggers the production deploy (deploy.yml).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per branch per event; a new push cancels the stale run. The event is
# part of the group so a merge push never cancels its own pull_request run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Every route classified, every search destination real (apps/web/src/navigation).
      - run: npm run validate:navigation
      # The Claude Code hooks (.claude/hooks) and the repo scripts (scripts/, apps/web/scripts) are
      # code too. The hooks fail open, so a broken one is silent; these tests are what notices.
      - name: Hook and script tests
        run: npm run test:tooling

  # Every workspace enforces 100% lines, branches, functions and statements in
  # its vitest config. Lowering a threshold or excluding a file is not allowed;
  # see .claude/rules/coverage.md.
  test:
    name: Unit tests (100% coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
            firebase/functions/coverage/
            firebase/seed/coverage/
          retention-days: 7

  # Security rules are the real access gate, so they are tested against the
  # Firestore emulator on every change. The emulator needs Java.
  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run test:rules

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # The JavaScript a first visit downloads stays under 320 KB gzip (.plan/10-testing-and-ci.md).
      - run: npm run check:bundle

  # Accessibility, performance and best practice of the sign-in page, on the built app.
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Placeholder public config: without it the app cannot start and the audit sees a blank page.
      - run: npm run build -w @gurukul/web
        env:
          VITE_FIREBASE_API_KEY: demo-key
          VITE_FIREBASE_AUTH_DOMAIN: demo-gurukul.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: demo-gurukul
          VITE_FIREBASE_APP_ID: 1:000000000000:web:lighthouse
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json

  # The three journeys (learner, Kulapati, Acharya) in a real browser, against the built app and the
  # Auth, Firestore and Functions emulators (e2e/). Needs Java for the Firestore emulator and
  # Chromium for Playwright. The Playwright config builds the functions and the app and starts the
  # emulators itself.
  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  ci:
    name: ci
    if: always()
    needs: [quality, test, rules, build, lighthouse, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | grep -Eq '"(failure|cancelled)"' && exit 1 || exit 0
