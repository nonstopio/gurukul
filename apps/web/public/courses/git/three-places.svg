<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" fill="#101828" role="img" aria-labelledby="t">
  <title id="t">Three places your work lives: the working folder, where you edit; the staging area, where you pack what goes into the next save; and the history of saved commits. git add moves changes to the staging area, git commit saves them into history.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#05764c"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 15px; }
    .h { font-size: 18px; font-weight: 600; }
    .s { font-size: 14px; fill: #475467; }
    .cmd { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 15px; font-weight: 600; fill: #05764c; }
  </style>
  <rect width="680" height="290" rx="16" fill="#ffffff"/>

  <rect x="20" y="24" width="176" height="242" rx="12" fill="#f6f7f5" stroke="#d0d5dd"/>
  <text class="h" x="36" y="56">Working folder</text>
  <text class="s" x="36" y="80">Your desk: the files</text>
  <text class="s" x="36" y="98">you are editing</text>
  <rect x="36" y="124" width="144" height="36" rx="6" fill="#ffffff" stroke="#d0d5dd"/>
  <text class="mono" x="48" y="147">menu.md</text>
  <rect x="36" y="170" width="144" height="36" rx="6" fill="#ffffff" stroke="#d0d5dd"/>
  <text class="mono" x="48" y="193">notes.txt</text>


  <rect x="252" y="24" width="176" height="242" rx="12" fill="#fbf8ef" stroke="#e3d5b4"/>
  <text class="h" x="268" y="56">Staging area</text>
  <text class="s" x="268" y="80">The box you are packing</text>
  <text class="s" x="268" y="98">for the next save</text>
  <rect x="268" y="124" width="144" height="36" rx="6" fill="#ffffff" stroke="#e3d5b4"/>
  <text class="mono" x="280" y="147">menu.md</text>


  <rect x="484" y="24" width="176" height="242" rx="12" fill="#e9f7f0" stroke="#9ed9bf"/>
  <text class="h" x="500" y="56">History</text>
  <text class="s" x="500" y="80">The album of saved</text>
  <text class="s" x="500" y="98">snapshots (commits)</text>
  <line x1="520" y1="142" x2="520" y2="238" stroke="#9ed9bf" stroke-width="4"/>
  <circle cx="520" cy="142" r="11" fill="#05764c"/>
  <circle cx="520" cy="190" r="11" fill="#05764c"/>
  <circle cx="520" cy="238" r="11" fill="#05764c"/>
  <text x="542" y="147" font-size="15">Add menu</text>
  <text x="542" y="195" font-size="15">Add prices</text>
  <text x="542" y="243" font-size="15">Fix typo</text>
  <line x1="200" y1="200" x2="248" y2="200" stroke="#05764c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="180" y="214" width="88" height="30" rx="15" fill="#ffffff" stroke="#05764c" stroke-width="1.5"/>
  <text class="cmd" x="224" y="234" text-anchor="middle">git add</text>
  <line x1="432" y1="200" x2="480" y2="200" stroke="#05764c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="402" y="214" width="108" height="30" rx="15" fill="#ffffff" stroke="#05764c" stroke-width="1.5"/>
  <text class="cmd" x="456" y="234" text-anchor="middle">git commit</text>
</svg>
