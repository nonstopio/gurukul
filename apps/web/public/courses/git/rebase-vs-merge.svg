<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" fill="#101828" role="img" aria-labelledby="t">
  <title id="t">Merge keeps both lines of history and ties them with a merge commit. Rebase copies your commits onto the newest main, so history becomes one straight line of new commits.</title>
  <style>
    text { font-family: Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .h { font-size: 18px; font-weight: 600; }
    .s { font-size: 14px; fill: #475467; }
    .l { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #ffffff; }
  </style>
  <rect width="680" height="380" rx="16" fill="#ffffff"/>

  <text class="h" x="20" y="40">Merge</text>
  <text class="s" x="20" y="62">Keeps what really happened, with a knot where the lines join.</text>
  <path d="M60 150 L520 150" stroke="#9ed9bf" stroke-width="5"/>
  <path d="M170 150 C 210 150, 210 100, 250 100 L 380 100 C 430 100, 470 150, 520 150" stroke="#e3d5b4" stroke-width="5" fill="none"/>
  <circle cx="60" cy="150" r="14" fill="#05764c"/><text class="l" x="55" y="155">A</text>
  <circle cx="170" cy="150" r="14" fill="#05764c"/><text class="l" x="165" y="155">B</text>
  <circle cx="340" cy="150" r="14" fill="#05764c"/><text class="l" x="335" y="155">C</text>
  <circle cx="270" cy="100" r="14" fill="#b39553"/><text class="l" x="265" y="105">D</text>
  <circle cx="380" cy="100" r="14" fill="#b39553"/><text class="l" x="375" y="105">E</text>
  <circle cx="520" cy="150" r="16" fill="#ffffff" stroke="#05764c" stroke-width="5"/>
  <text class="s" x="544" y="155">merge commit</text>

  <line x1="20" y1="196" x2="660" y2="196" stroke="#e4e7ec" stroke-width="2"/>

  <text class="h" x="20" y="232">Rebase</text>
  <text class="s" x="20" y="254">Replays your commits on top of the newest main, as new copies.</text>
  <path d="M60 320 L560 320" stroke="#9ed9bf" stroke-width="5"/>
  <circle cx="60" cy="320" r="14" fill="#05764c"/><text class="l" x="55" y="325">A</text>
  <circle cx="170" cy="320" r="14" fill="#05764c"/><text class="l" x="165" y="325">B</text>
  <circle cx="280" cy="320" r="14" fill="#05764c"/><text class="l" x="275" y="325">C</text>
  <circle cx="390" cy="320" r="16" fill="#b39553"/><text class="l" x="380" y="325">D'</text>
  <circle cx="500" cy="320" r="16" fill="#b39553"/><text class="l" x="490" y="325">E'</text>
  <text class="s" x="370" y="360">new copies of D and E</text>
</svg>
