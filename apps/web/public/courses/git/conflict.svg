<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" fill="#101828" role="img" aria-labelledby="t">
  <title id="t">A merge conflict. The menu said Masala chai 15 rupees. On main, Arjun changed it to 25. On her branch, Meera changed it to 20. Git will not guess, so it writes both versions into the file between markers and asks you to choose.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#667085"/>
    </marker>
  </defs>
  <style>
    text { font-family: Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 15px; }
    .s { font-size: 14px; fill: #475467; }
    .who { font-size: 15px; font-weight: 600; }
  </style>
  <rect width="680" height="400" rx="16" fill="#ffffff"/>

  <rect x="230" y="20" width="220" height="44" rx="8" fill="#f2f4f7" stroke="#d0d5dd"/>
  <text class="mono" x="254" y="48">Masala chai ₹15</text>

  <line x1="290" y1="66" x2="200" y2="108" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="66" x2="600" y2="108" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>

  <text class="who" x="40" y="104">main (Arjun)</text>
  <rect x="40" y="114" width="250" height="44" rx="8" fill="#e9f7f0" stroke="#9ed9bf"/>
  <text class="mono" x="62" y="142">Masala chai ₹25</text>

  <text class="who" x="390" y="104">cold-drinks (Meera)</text>
  <rect x="390" y="114" width="250" height="44" rx="8" fill="#f5eedc" stroke="#e3d5b4"/>
  <text class="mono" x="412" y="142">Masala chai ₹20</text>

  <line x1="165" y1="160" x2="290" y2="198" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="515" y1="160" x2="390" y2="198" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="150" y="204" width="380" height="150" rx="10" fill="#fef3e7" stroke="#e8b48a"/>
  <text class="mono" x="172" y="234" fill="#93370d">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
  <text class="mono" x="172" y="260">Masala chai ₹25</text>
  <text class="mono" x="172" y="286" fill="#93370d">=======</text>
  <text class="mono" x="172" y="312">Masala chai ₹20</text>
  <text class="mono" x="172" y="338" fill="#93370d">&gt;&gt;&gt;&gt;&gt;&gt;&gt; cold-drinks</text>

  <text class="s" x="150" y="384">Git will not guess. You pick the right line and delete the markers.</text>
</svg>
