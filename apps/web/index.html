<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NonStop Gurukul — courses, Quizzes and certificates for NonStop io."
    />
    <title>NonStop Gurukul</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      try {
        var t = localStorage.getItem('gurukul-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      /* The boot loader: pure CSS, painted before any script loads (see packages/ui GlobalLoader). */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 12px;
        background: var(--bg, #f6f7f3);
        color: var(--text, #121c17);
        font:
          500 14px system-ui,
          sans-serif;
        transition: opacity 240ms ease;
      }
      #boot-loader.boot-loader--leaving {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        #boot-loader {
          background: var(--bg, #0e1511);
          color: var(--text, #eaf2ec);
        }
      }
      :root[data-theme='dark'] #boot-loader {
        background: #0e1511;
        color: #eaf2ec;
      }
      :root[data-theme='light'] #boot-loader {
        background: #f6f7f3;
        color: #121c17;
      }
      #boot-loader svg {
        width: 72px;
        height: 72px;
        overflow: visible;
      }
      #boot-loader .t {
        fill: none;
        stroke: #76847b;
        stroke-width: 3;
        opacity: 0.4;
      }
      #boot-loader .a {
        fill: none;
        stroke: #0a6a46;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-dasharray: 60 160;
        transform-origin: 36px 36px;
        animation: boot-turn 1600ms linear infinite;
      }
      #boot-loader .f {
        fill: #f2a02b;
        transform-origin: 36px 50px;
        animation: boot-breathe 1600ms ease-in-out infinite;
      }
      @media (prefers-color-scheme: dark) {
        #boot-loader .a {
          stroke: #46d39b;
        }
      }
      :root[data-theme='dark'] #boot-loader .a {
        stroke: #46d39b;
      }
      :root[data-theme='light'] #boot-loader .a {
        stroke: #0a6a46;
      }
      @keyframes boot-turn {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-breathe {
        0%,
        100% {
          transform: scale(0.88);
          opacity: 0.85;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .a {
          animation: none;
        }
        #boot-loader .f {
          animation: boot-pulse 1600ms ease-in-out infinite;
        }
        @keyframes boot-pulse {
          50% {
            opacity: 0.55;
          }
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="32x32 16x16" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="boot-loader" role="status">
      <svg viewBox="0 0 72 72" aria-hidden="true" focusable="false">
        <circle class="t" cx="36" cy="36" r="30" />
        <circle class="a" cx="36" cy="36" r="30" />
        <path
          class="f"
          d="M36 20c2.4 8 10 10 10 20a10 10 0 0 1-20 0c0-4 2-6 4-8 .2 4 2 6 4 6-.4-8-2-12 2-18z"
        />
      </svg>
      <span>Getting your learning ready</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
