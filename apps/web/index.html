<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NonStop Gurukul — courses, Quizzes and certificates for NonStop io."
    />
    <title>NonStop Gurukul</title>
    <!-- Link previews (Slack, WhatsApp, LinkedIn). The image tags are added at build time from
         VITE_SITE_URL (src/seo/shareImage.ts), since Open Graph needs an absolute address. No og:url:
         every path serves this file, so it would point every shared link at the home page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NonStop Gurukul" />
    <meta property="og:title" content="NonStop Gurukul" />
    <meta
      property="og:description"
      content="NonStop Gurukul — courses, Quizzes and certificates for NonStop io."
    />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      try {
        var t = localStorage.getItem('gurukul-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      /* The boot loader: pure CSS, painted before any script loads. Its G is the same drawing as
         packages/ui GlobalLoader; the colours are literals because tokens.css is not loaded yet. */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: #f6f7f3;
        transition: opacity 240ms ease;
      }
      #boot-loader.boot-loader--leaving {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #boot-loader {
          background: #0e1511;
        }
      }
      :root[data-theme='dark'] #boot-loader {
        background: #0e1511;
      }
      #boot-loader .logo {
        width: 64px;
        height: 64px;
        overflow: visible;
      }
      #boot-loader .tile {
        fill: #059d66;
      }
      #boot-loader .tile,
      #boot-loader .s {
        transform-origin: 24px 24px;
        animation: boot-tile 2000ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      #boot-loader .s {
        fill: #fff;
        animation-name: boot-top;
      }
      #boot-loader .s2 {
        animation-name: boot-bottom;
      }
      /* The words are for screen readers; the G is what people see. */
      #boot-loader .l {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @keyframes boot-top {
        0% {
          opacity: 0;
          transform: translateY(-6px);
        }
        22%,
        72% {
          opacity: 1;
          transform: none;
        }
        92%,
        100% {
          opacity: 0;
          transform: scale(0.85);
        }
      }
      @keyframes boot-bottom {
        0%,
        12% {
          opacity: 0;
          transform: translateY(6px);
        }
        34%,
        72% {
          opacity: 1;
          transform: none;
        }
        92%,
        100% {
          opacity: 0;
          transform: scale(0.85);
        }
      }
      @keyframes boot-tile {
        0%,
        72% {
          transform: none;
        }
        86% {
          transform: scale(0.94);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .tile {
          animation: none;
        }
        #boot-loader .s {
          animation: boot-pulse 2000ms ease-in-out infinite;
        }
        @keyframes boot-pulse {
          50% {
            opacity: 0.45;
          }
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="32x32 16x16" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="boot-loader" role="status">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <rect class="tile" width="48" height="48" rx="3" />
        <path
          class="s"
          d="M10.3 10H37.7V19.786L33.786 15.871V13.914H14.214V21.743L10.3 17.829V10Z"
        />
        <path
          class="s s2"
          d="M10.3 21.743L14.214 25.657V33.486H33.786V25.657H25.957V27.614L22.043 31.529V21.743H37.7V37.4H10.3V21.743Z"
        />
      </svg>
      <span class="l">Getting your learning ready</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
